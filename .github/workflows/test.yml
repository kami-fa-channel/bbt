# Test automatici su GitHub, a ogni modifica e a ogni pull request.
#
# - "linux" e' il controllo che conta: Linux e' l'unico sistema supportato (vedi il
#   README, sezione "Sistemi supportati").
# - "altri-sistemi" e' sperimentale: prova Windows, macOS e la versione minima di
#   Python dichiarata in pyproject.toml.  Se fallisce non fa fallire il workflow: e'
#   un'informazione, non un impegno a supportare quei sistemi.
name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # i test della finestra non devono saltare in silenzio
      LEGATORIA_GUI_OBBLIGATORIA: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Pacchetti di sistema (tkinter, display virtuale)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb

      - name: Ambiente virtuale e dipendenze
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pytest

      - name: Test
        run: xvfb-run -a .venv/bin/python -m pytest -ra

      - name: Installazione del pacchetto (pip install .)
        run: |
          .venv/bin/python -m pip install .
          .venv/bin/bbt --version

  altri-sistemi:
    name: ${{ matrix.nome }} (sperimentale)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: Windows, os: windows-latest, python: "3.12" }
          - { nome: macOS, os: macos-latest, python: "3.12" }
          - { nome: "Linux con Python minimo", os: ubuntu-24.04, python: "3.10" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Display virtuale (solo Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Dipendenze
        run: python -m pip install -r requirements.txt pytest

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m pytest -ra
          else
            python -m pytest -ra
          fi
